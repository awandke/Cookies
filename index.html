<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookies for James</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2d241f;
        background: #fff8ef;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(90%, 44rem);
        padding: 2.5rem;
        text-align: center;
        background: white;
        border: 1px solid #eadbc8;
        border-radius: 1rem;
        box-shadow: 0 1rem 2.5rem rgb(75 47 28 / 12%);
      }

      h1 {
        margin-top: 0;
      }

      main:has(details[open]) {
        width: min(96%, 80rem);
        padding: clamp(1rem, 4vw, 2.5rem);
      }

      p {
        color: #6b5a4e;
      }

      button {
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border: 0;
        border-radius: 0.6rem;
        color: white;
        background: #8b4b2b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #70391f;
      }

      button:focus-visible,
      summary:focus-visible {
        outline: 3px solid #d59b70;
        outline-offset: 3px;
      }

      #status {
        min-height: 1.5rem;
        margin-bottom: 0;
        font-weight: 600;
        white-space: pre-line;
      }

      details {
        margin-top: 1rem;
      }

      summary {
        color: #8b4b2b;
        cursor: pointer;
      }

      #cookie-instructions figure {
        margin: 1.5rem 0 0;
        text-align: left;
      }

      #cookie-instructions figcaption {
        font-weight: 700;
        font-size: 1.25rem;
        line-height: 1.5;
      }

      #cookie-instructions img {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 0.75rem;
        border-radius: 0.5rem;
      }

      .screenshot-button,
      .screenshot-button:hover {
        display: block;
        width: 100%;
        padding: 0;
        margin: 0;
        background: transparent;
        cursor: zoom-in;
      }

      #screenshot-viewer {
        box-sizing: border-box;
        width: 96vw;
        max-width: none;
        max-height: 95dvh;
        padding: 1rem;
        border: 0;
        border-radius: 0.6rem;
      }

      #screenshot-viewer::backdrop {
        background: rgb(0 0 0 / 75%);
      }

      #screenshot-viewer form {
        position: sticky;
        top: -1rem;
        padding-bottom: 0.75rem;
        background: white;
        text-align: right;
      }

      #screenshot-viewer button {
        margin-top: 0;
      }

      #screenshot-viewer img {
        display: block;
        width: auto;
        min-width: 100%;
        max-width: none;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cookies for James</h1>
      <button id="create-cookie" type="button">bake a cookie</button>
      <p id="status" role="status" aria-live="polite"></p>
      <details id="cookie-instructions" hidden>
        <summary>show instructions for viewing your cookie</summary>
        <p>Click a picture to see it larger.</p>
        <figure>
          <figcaption>1. Right-click this page and choose Inspect (or press Ctrl+Shift+I).</figcaption>
          <button class="screenshot-button" type="button" aria-label="Enlarge the Inspect screenshot">
            <img src="inspect.png" alt="Right-click menu with a red arrow pointing to Inspect." loading="lazy" />
          </button>
        </figure>
        <figure>
          <figcaption>2. Choose the "Application" tab at the top of the panel. You may need to click the &gt;&gt; icon to see all the tabs.</figcaption>
          <button class="screenshot-button" type="button" aria-label="Enlarge the Application screenshot">
            <img src="application.png" alt="Red arrows pointing to the Application tab and the extra tabs icon." loading="lazy" />
          </button>
        </figure>
        <figure>
          <figcaption>3. In the left panel, under "Storage", click Cookies, then choose "https://awandke.github.io".</figcaption>
          <button class="screenshot-button" type="button" aria-label="Enlarge the Cookies screenshot">
            <img src="cookies.png" alt="Red arrow pointing to Cookies, with the site listed below it." loading="lazy" />
          </button>
        </figure>
      </details>
    </main>

    <dialog id="screenshot-viewer" aria-label="Enlarged screenshot">
      <form method="dialog"><button type="submit">Close picture</button></form>
      <img alt="" />
    </dialog>

    <script>
      const button = document.querySelector("#create-cookie");
      const status = document.querySelector("#status");
      const instructions = document.querySelector("#cookie-instructions");
      const screenshotViewer = document.querySelector("#screenshot-viewer");
      const enlargedImage = screenshotViewer.querySelector("img");

      document.querySelectorAll(".screenshot-button").forEach((trigger) => {
        trigger.addEventListener("click", () => {
          const screenshot = trigger.querySelector("img");
          enlargedImage.src = screenshot.src;
          enlargedImage.alt = screenshot.alt;
          screenshotViewer.showModal();
          screenshotViewer.scrollTo(0, 0);
        });
      });

      button.addEventListener("click", () => {
        document.cookie = "CookiesForJames=Happy Birthday!; max-age=604800; path=/; SameSite=Lax";

        const cookieWasCreated = document.cookie
          .split("; ")
          .some((cookie) => cookie.startsWith("CookiesForJames="));

        status.textContent = cookieWasCreated
          ? "🍪 Cookie created! 🍪\n🍪 Your cookie will stay in your browser for seven days. 🍪"
          : "The cookie could not be created. Check your browser settings. 🍪";
        instructions.hidden = !cookieWasCreated;
      });
    </script>
  </body>
</html>
