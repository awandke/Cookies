<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Creator</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2d241f;
        background: #fff8ef;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90%, 28rem);
        padding: 2.5rem;
        text-align: center;
        background: white;
        border: 1px solid #eadbc8;
        border-radius: 1rem;
        box-shadow: 0 1rem 2.5rem rgb(75 47 28 / 12%);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #6b5a4e;
      }

      button {
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border: 0;
        border-radius: 0.6rem;
        color: white;
        background: #8b4b2b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #70391f;
      }

      button:focus-visible {
        outline: 3px solid #d59b70;
        outline-offset: 3px;
      }

      #status {
        min-height: 1.5rem;
        margin-bottom: 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Create a cookie</h1>
      <p>Press the button to save a cookie in your browser for seven days.</p>
      <button id="create-cookie" type="button">Create cookie</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const button = document.querySelector("#create-cookie");
      const status = document.querySelector("#status");

      button.addEventListener("click", () => {
        document.cookie = "CookiesForJames=Happy Birthday!; max-age=604800; path=/; SameSite=Lax";

        const cookieWasCreated = document.cookie
          .split("; ")
          .some((cookie) => cookie.startsWith("CookiesForJames="));

        status.textContent = cookieWasCreated
          ? "Cookie created! 🍪"
          : "The cookie could not be created. Check your browser settings.";
      });
    </script>
  </body>
</html>
